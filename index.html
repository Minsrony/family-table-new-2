<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Family Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column. A 4-step guided setup, then a results area with four tabs.
   Type: Fredoka (rounded, friendly) for headings, Atkinson Hyperlegible (made for low-vision readers) for everything else. */
:root {
  --bg: #FFFCF5; --surface: #FFFFFF; --soft: #FFF3D6; --ink: #1A2433; --muted: #4A5568;
  --line: #E0DAC9; --ctl: #5B6270; --primary: #14634F; --on-primary: #FFFFFF;
  --accent: #FFC53D; --on-accent: #1A2433; --good: #1B6E2F; --good-bg: #E3F4E6;
  --warn: #8A4300; --warn-bg: #FFEBD2; --bad: #B3261E; --bad-bg: #FDE6E4;
  --m0: #DCEBFF; --m1: #FFE0DE; --m2: #DDF3E4; --m3: #FFF0C2; --m4: #EBDDFB; --m5: #D7F2F2;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1B222C; --soft: #2A2616; --ink: #F2F4F7; --muted: #B8C0CC;
    --line: #323B48; --ctl: #8D97A6; --primary: #5ED1AE; --on-primary: #0B2A22;
    --accent: #FFC93C; --on-accent: #1A1400; --good: #7BE08F; --good-bg: #1B3A24;
    --warn: #FFB866; --warn-bg: #3D2A10; --bad: #FF8A80; --bad-bg: #4A1F1C;
    --m0: #1F3552; --m1: #53262A; --m2: #1F4A33; --m3: #52441B; --m4: #3F2F5C; --m5: #1B4547;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --surface: #1B222C; --soft: #2A2616; --ink: #F2F4F7; --muted: #B8C0CC;
  --line: #323B48; --ctl: #8D97A6; --primary: #5ED1AE; --on-primary: #0B2A22;
  --accent: #FFC93C; --on-accent: #1A1400; --good: #7BE08F; --good-bg: #1B3A24;
  --warn: #FFB866; --warn-bg: #3D2A10; --bad: #FF8A80; --bad-bg: #4A1F1C;
  --m0: #1F3552; --m1: #53262A; --m2: #1F4A33; --m3: #52441B; --m4: #3F2F5C; --m5: #1B4547;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 clamp(18px, 2.4vw, 21px)/1.5 var(--font-body);
  padding-block: 12px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 6vw, 44px); }
h2 { font-size: clamp(26px, 4.6vw, 34px); }
h3 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 26px; }
.brand svg { width: 40px; height: 40px; }
.hint-tag { font-size: 0.8em; padding: 4px 12px; border-radius: 99px; background: var(--soft); border: 2px solid var(--accent); }

/* stepper */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; list-style: none; margin: 0; padding: 0; }
.steps button {
  width: 100%; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; cursor: pointer; padding: 6px 4px; font-weight: 700; font-size: 0.82em;
}
.steps .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); border: 2px solid var(--ctl); font-family: var(--font-display); }
.steps button[aria-current="step"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.steps button[aria-current="step"] .num { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.steps button.done .num { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.steps .lbl { display: none; }
@media (min-width: 560px) { .steps .lbl { display: inline; } .steps button { flex-direction: row; gap: 10px; font-size: 0.9em; } }

/* cards, forms */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.card.soft { background: var(--soft); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > * { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; }
.field > label, .lab { font-weight: 700; }
input[type=text], input[type=number], input[type=date], select {
  min-height: 54px; padding: 8px 14px; border: 2px solid var(--ctl); border-radius: 14px; background: var(--surface); width: 100%;
}
input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--primary); flex: none; }
.btn {
  min-height: 54px; padding: 10px 22px; border-radius: 99px; border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--ctl); }
.btn.big { min-height: 66px; font-size: 1.15em; padding-inline: 34px; }
.btn.small-btn { min-height: 44px; padding: 6px 16px; font-size: 0.9em; }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn svg, .ic { width: 24px; height: 24px; flex: none; }
.actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper .val { min-width: 56px; text-align: center; font-weight: 700; font-size: 1.25em; font-variant-numeric: tabular-nums; }
.stepper button { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--surface); cursor: pointer; display: grid; place-items: center; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  min-height: 52px; padding: 8px 18px; border-radius: 99px; border: 2px solid var(--ctl); background: var(--surface); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--ink); }
.chip[aria-pressed="true"]::before { content: "\2713"; font-weight: 800; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px; border-radius: 99px; font-size: 0.78em; font-weight: 700; border: 2px solid var(--line); background: var(--surface); }
.tag.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

/* members */
.mtabs { display: flex; flex-wrap: wrap; gap: 10px; }
.mtab { min-height: 58px; padding: 8px 18px; border-radius: 18px; border: 2px solid var(--ctl); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; background: var(--surface); }
.mtab[aria-selected="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--ink); border: 2px solid var(--ctl); flex: none; }
.c0 { background: var(--m0); } .c1 { background: var(--m1); } .c2 { background: var(--m2); } .c3 { background: var(--m3); } .c4 { background: var(--m4); } .c5 { background: var(--m5); }
.member-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: end; padding: 14px; border: 2px solid var(--line); border-radius: 18px; }
.member-card .avatar { width: 52px; height: 52px; font-size: 1.3em; align-self: center; }
@media (max-width: 560px) { .member-card { grid-template-columns: auto 1fr; } .member-card .rm { grid-column: 1 / -1; } }
.meter { padding: 14px 18px; border-radius: 16px; background: var(--soft); border: 2px solid var(--accent); display: flex; flex-direction: column; gap: 8px; }
.meter .nums { display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 700; }

/* lists (stock, requests) */
.list { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 16px; flex-wrap: wrap; }
.item .grow { flex: 1 1 160px; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.item input[type=number] { width: 110px; min-height: 46px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.empty { padding: 18px; border: 2px dashed var(--ctl); border-radius: 16px; text-align: center; color: var(--muted); }
.grid-out { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 8px; align-items: center; }
.grid-out .dl { font-weight: 700; padding-right: 6px; }
.grid-out .chip { justify-content: center; width: 100%; padding-inline: 6px; }
.notice { padding: 14px 18px; border-radius: 16px; border: 2px solid var(--warn); background: var(--warn-bg); color: var(--ink); display: flex; gap: 12px; align-items: flex-start; }
.notice svg { color: var(--warn); margin-top: 2px; }
.notice.ok { border-color: var(--good); background: var(--good-bg); }
.notice.ok svg { color: var(--good); }

/* results */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { min-height: 56px; padding: 8px 20px; border-radius: 99px; border: 2px solid var(--ctl); background: var(--surface); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.summary-line { display: flex; flex-wrap: wrap; gap: 10px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.day { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; overflow: hidden; }
.day > header { padding: 12px 18px; background: var(--soft); border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.day > header h3 { font-size: 21px; }
.meal { border-top: 2px solid var(--line); }
.meal:first-of-type { border-top: 0; }
.meal-btn { width: 100%; text-align: left; background: none; border: 0; padding: 14px 18px; cursor: pointer; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; min-height: 76px; }
.meal-ic { font-size: 34px; line-height: 1; text-align: center; }
.meal-kind { font-size: 0.78em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.meal-name { font-weight: 700; line-height: 1.25; }
.meal-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chev { width: 24px; height: 24px; transition: transform 0.15s; }
.meal.open .chev { transform: rotate(180deg); }
.detail { padding: 4px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.detail h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; }
.detail ul, .detail ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 4px; }
.nutr-row { display: flex; flex-wrap: wrap; gap: 8px; }
.nutr-row span { padding: 4px 12px; border-radius: 12px; background: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.alts { display: flex; flex-direction: column; gap: 8px; }
.alt { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 12px; border: 2px solid var(--line); border-radius: 14px; }
.skip-row, .none-row { padding: 18px; color: var(--muted); display: flex; gap: 12px; align-items: center; }

/* grocery */
.groc { display: flex; flex-direction: column; gap: 10px; }
.groc label { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; min-height: 60px; }
.groc label .nm { flex: 1 1 auto; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.groc label .qt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.groc label .st { display: block; font-weight: 400; font-size: 0.8em; color: var(--muted); }
.groc input:checked ~ .nm { text-decoration: line-through; color: var(--muted); }
.groc.have label { background: var(--good-bg); border-color: var(--good); }

/* nutrition */
.mem-nutr { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; }
@media (max-width: 480px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .track { grid-column: 1 / -1; order: 3; } }
.track { height: 18px; border-radius: 99px; background: var(--soft); border: 2px solid var(--ctl); overflow: hidden; position: relative; }
.fill { display: block; height: 100%; background: var(--primary); }
.fill.warn { background: var(--warn); }
.macro { display: flex; height: 40px; border-radius: 12px; overflow: hidden; border: 2px solid var(--ctl); font-weight: 700; }
.macro span { display: grid; place-items: center; color: var(--ink); min-width: 0; font-size: 0.85em; }
.m-p { background: var(--m1); } .m-c { background: var(--m3); } .m-f { background: var(--m0); }
.daybars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 190px; padding-top: 8px; }
.daybar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 0.8em; font-weight: 700; }
.daybar .col { width: 100%; max-width: 54px; background: var(--primary); border-radius: 10px 10px 4px 4px; min-height: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 700; font-size: 0.85em; }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--ctl); vertical-align: -2px; margin-right: 6px; }
.fine { font-size: 0.82em; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 99px; font-weight: 700; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
<div id="app"></div>
<script>
// Recipe library, part 1: helper and breakfasts.
// Mix: mostly South Indian, a good share of chapati and sabji (cuisine "North Indian"), and some Mediterranean.
// Quantities are per ADULT serving. Units: g, ml, pc. Category codes: P produce, M meat/fish, D dairy & eggs, G pantry & tins, B bakery, S staple (assumed at home, not listed).
const RECIPES = [];
function R(id, icon, name, meal, cuisine, flags, nutr, ingr, steps, variation) {
  const f = flags.split(' ').filter(Boolean);
  const n = nutr.split(',').map(Number);
  const tm = f.find(x => /^t\d+$/.test(x));
  const grp = f.find(x => /^g:/.test(x));
  RECIPES.push({
    id, icon, name, meal, cuisine,
    allergens: f.filter(x => ALLERGENS.includes(x)),
    soft: f.includes('soft2') ? 2 : f.includes('soft1') ? 1 : 0,
    spicy: f.includes('spicy'),
    keeps: f.includes('keeps'),
    time: tm ? +tm.slice(1) : 20,
    groups: grp ? grp.slice(2).split('') : [],
    nutr: { kcal: n[0], protein: n[1], carbs: n[2], fat: n[3], fiber: n[4], sugar: n[5], sodium: n[6] },
    ingr: ingr.split(';').map(s => {
      const [name, qty, unit, cat] = s.trim().split('|');
      return { name, qty: +qty, unit, cat };
    }),
    steps, variation
  });
}
const ALLERGENS = ['gluten','dairy','egg','peanut','treenut','soy','fish','shellfish','sesame','pork','beef','chicken','lamb','honey'];

// ---------- BREAKFAST: South Indian ----------
R('b1','🍚','Idli with sambar','b','South Indian','soft2 t25 g:pcv','340,13,64,3,6,4,420',
 'Idli batter|150|g|G;Toor dal|25|g|G;Mixed vegetables|60|g|P;Sambar powder|3|g|S',
 ['Pour the batter into idli moulds and steam for 10 to 12 minutes.','Pressure-cook the dal with chopped vegetables and sambar powder until soft.','Serve the idlis with hot sambar.'],
 'Add a spoon of coconut chutney on the side.');
R('b2','🫓','Plain dosa with coconut chutney','b','South Indian','soft1 t20 g:cp','360,9,58,10,4,2,300',
 'Dosa batter|150|g|G;Grated coconut|30|g|P;Roasted gram|10|g|G;Cooking oil|8|ml|S',
 ['Spread the batter thinly on a hot, lightly oiled pan and cook until crisp and golden.','Grind coconut, roasted gram and a little water into a smooth chutney.','Serve the dosa hot with the chutney.'],
 'Make a thicker, softer dosa for anyone who prefers an easier bite.');
R('b3','🫓','Masala dosa with potato filling','b','South Indian','soft1 t30 g:cv','420,10,72,10,5,3,340',
 'Dosa batter|150|g|G;Potato|120|g|P;Onion|40|g|P;Cooking oil|8|ml|S;Turmeric|1|g|S',
 ['Boil and crumble the potatoes, then fry with onion, turmeric and a pinch of salt.','Cook the dosa on a hot pan until crisp.','Fill with the potato masala and fold.'],
 'Add grated carrot to the filling for colour and fibre.');
R('b4','🥣','Vegetable upma','b','South Indian','gluten soft2 t20 g:cv','330,9,56,8,4,3,330',
 'Semolina (rava)|60|g|G;Mixed vegetables|60|g|P;Onion|30|g|P;Mustard seeds|1|g|S;Cooking oil|8|ml|S',
 ['Dry-roast the semolina until fragrant and set aside.','Pop mustard seeds in oil, add onion and vegetables and cook for 5 minutes.','Add hot water, stir in the semolina and cook until soft and fluffy.'],
 'Use broken wheat or millet rava for a higher-fibre version.');
R('b5','🍚','Ven pongal','b','South Indian','dairy soft2 t30 g:pc','380,12,60,10,4,1,260',
 'Rice|50|g|G;Moong dal|25|g|G;Ghee|8|g|D;Black pepper|1|g|S;Cumin|1|g|S',
 ['Cook the rice and moong dal together until very soft and creamy.','Temper ghee with pepper and cumin.','Stir the tempering into the pongal and serve warm.'],
 'Use oil in place of ghee to keep it dairy-free.');
R('b6','🥣','Ragi porridge with banana','b','South Indian','soft2 t12 g:cf','300,6,66,2,6,22,20',
 'Ragi flour|40|g|G;Banana|1|pc|P;Jaggery|10|g|G',
 ['Mix ragi flour with cold water to a smooth paste.','Cook over low heat, stirring, for 6 to 8 minutes until thick.','Stir in jaggery and top with sliced banana.'],
 'Use milk instead of water for extra protein and calcium.');
R('b7','🥞','Vegetable uttapam','b','South Indian','soft1 t25 g:cv','340,10,62,5,5,4,320',
 'Dosa batter|150|g|G;Onion|30|g|P;Tomato|40|g|P;Carrot|30|g|P;Cooking oil|6|ml|S',
 ['Pour a thick round of batter onto a hot pan.','Press chopped onion, tomato and grated carrot into the top.','Cook covered for 3 minutes, flip, and cook 2 minutes more.'],
 'Serve with sambar left over from yesterday.');
R('b8','🥘','Appam with vegetable stew','b','South Indian','soft2 t35 g:cv','410,8,68,12,6,5,300',
 'Rice|45|g|G;Coconut milk|80|ml|G;Mixed vegetables|100|g|P;Potato|60|g|P;Cooking oil|5|ml|S',
 ['Soak and grind the rice to a batter, rest it, then cook small lacy appams in a covered pan.','Simmer vegetables and potato in water until tender, then add coconut milk and warm through.','Serve the appams with the stew.'],
 'Use ready appam batter to save time.');

// ---------- BREAKFAST: chapati, paratha and North Indian ----------
R('b9','🍳','Egg bhurji with chapati','b','North Indian','egg gluten soft1 t25 g:pcv','380,19,36,17,5,3,330',
 'Eggs|2|pc|D;Onion|40|g|P;Tomato|50|g|P;Wheat flour (atta)|40|g|G;Cooking oil|8|ml|S;Turmeric|1|g|S',
 ['Knead atta with water into a soft dough and roll into chapatis; cook on a hot tawa.','Fry onion and tomato with turmeric, add the beaten eggs and scramble.','Serve the bhurji with warm chapati.'],
 'Add chopped spinach to the eggs for extra greens.');
R('b10','🥣','Vegetable poha','b','North Indian','soft2 t15 g:cv','330,7,62,6,4,2,310',
 'Poha (flattened rice)|60|g|G;Onion|30|g|P;Frozen peas|40|g|P;Carrot|30|g|P;Lemon|10|g|P;Cooking oil|8|ml|S',

  ['vegetarian', 'Vegetarian'], ['vegan', 'Vegan'], ['halal', 'Halal'], ['kosher', 'Kosher'],
  ['nopork', 'No pork'], ['nobeef', 'No beef']
];
const HEALTH_OPTS = [
  ['lowsalt', 'Low salt'], ['lowsugar', 'Low sugar'], ['soft', 'Soft foods'], ['mild', 'No spicy food']
];

function ageInfo(age) {
  age = Number(age);
  if (age < 4) return { label: 'Toddler', factor: 0.5, kcal: 1200, protein: 20, fiber: 15, sodium: 1000 };
  if (age < 12) return { label: 'Child', factor: 0.75, kcal: 1600, protein: 30, fiber: 20, sodium: 1500 };
  if (age < 18) return { label: 'Teen', factor: 1.2, kcal: 2400, protein: 55, fiber: 28, sodium: 2300 };
  if (age < 65) return { label: 'Adult', factor: 1, kcal: 2200, protein: 55, fiber: 28, sodium: 2300 };
  return { label: 'Senior', factor: 0.85, kcal: 1800, protein: 60, fiber: 25, sodium: 1500 };
}

function norm(s) {
  return String(s).toLowerCase().trim().replace(/oes\b/g, 'o').replace(/ies\b/g, 'y').replace(/(\w{3,})s\b/g, '$1');
}
function terms(str) {
  return String(str || '').split(/[,;\n]/).map(norm).filter(Boolean);
}
const SYN = [['eggplant', 'brinjal aubergine baingan'], ['okra', 'bhindi ladies finger'], ['bottle gourd', 'lauki'], ['curd', 'yogurt yoghurt dahi'],
  ['potato', 'aloo'], ['cauliflower', 'gobi'], ['spinach', 'palak'], ['chickpea', 'chana'], ['kidney bean', 'rajma'], ['prawn', 'shrimp'],
  ['lamb', 'mutton'], ['wheat flour', 'chapati roti atta'], ['black-eyed pea', 'lobia'], ['toor dal', 'sambar'], ['dosa batter', 'dosa'], ['idli batter', 'idli'],
  ['paneer', 'cottage cheese'], ['coconut', 'chutney'], ['bell pepper', 'capsicum'], ['zucchini', 'courgette']];
function recipeText(r) {
  const base = norm([r.name, r.cuisine, r.allergens.join(' '), r.ingr.map(i => i.name).join(' ')].join(' | '));
  return base + ' | ' + SYN.filter(([k]) => base.includes(k)).map(x => x[1]).join(' ');
}
function mainProtein(r) {
  for (const a of ['chicken', 'beef', 'pork', 'lamb', 'fish', 'shellfish']) if (r.allergens.includes(a)) return a;
  const t = r.ingr.map(i => i.name.toLowerCase()).join(' ');
  if (/paneer/.test(t)) return 'paneer';
  if (/tofu/.test(t)) return 'tofu';
  if (/lentil|\bdal\b|chickpea|chana|bean|rajma|lobia|black-eyed|moong/.test(t)) return 'legumes';
  if (r.allergens.includes('egg') && r.ingr.some(i => /egg/i.test(i.name) && i.qty >= 1)) return 'egg';
  if (r.allergens.includes('dairy')) return 'dairy';
  return 'veg';
}

// Returns a list of reasons this recipe is unsuitable for one member (empty = suitable).
function conflicts(r, m) {
  const out = [];
  const A = r.allergens, ar = m.allergies || [], di = m.diets || [], he = m.health || [];
  const age = Number(m.age);
  ar.forEach(a => { if (A.includes(a)) out.push(`contains ${a === 'treenut' ? 'tree nuts' : a}`); });
  const isMeat = A.some(a => MEAT.includes(a)), isSea = A.some(a => SEAFOOD.includes(a));
  if (di.includes('vegan') && (isMeat || isSea || A.includes('dairy') || A.includes('egg') || A.includes('honey'))) out.push('not vegan');
  else if (di.includes('vegetarian') && (isMeat || isSea)) out.push('not vegetarian');
  if ((di.includes('halal') || di.includes('nopork')) && A.includes('pork')) out.push('contains pork');
  if (di.includes('kosher') && (A.includes('pork') || A.includes('shellfish') || (isMeat && A.includes('dairy')))) out.push('not kosher');
  if (di.includes('nobeef') && A.includes('beef')) out.push('contains beef');
  const saltCap = r.meal === 'b' ? 450 : 600, sugarCap = r.meal === 'b' ? 12 : 10;
  if (he.includes('lowsalt') && r.nutr.sodium > saltCap) out.push('too salty');
  if (he.includes('lowsugar') && r.nutr.sugar > sugarCap) out.push('too sweet');
  if ((he.includes('soft') || age < 4) && r.soft === 0) out.push('not soft enough');
  if ((he.includes('mild') || age < 12) && r.spicy) out.push('too spicy');
  const rt = recipeText(r);
  terms(m.dislikes).forEach(t => { if (rt.includes(t)) out.push(`includes ${t}`); });
  return out;
}

function validFor(r, members) {
  const reasons = [];
  members.forEach(m => conflicts(r, m).forEach(c => reasons.push(`${m.name || 'Member'}: ${c}`)));
  return { ok: reasons.length === 0, reasons };
}

function likesScore(r, members) {
  const rt = recipeText(r);
  let s = 0;
  members.forEach(m => terms(m.likes).forEach(t => { if (rt.includes(t)) s += 1; }));
  return s;
}

function householdFactor(members) {
  return members.reduce((a, m) => a + ageInfo(m.age).factor, 0);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function stockMatches(stockName, ingName) {
  const clean = x => norm(String(x).replace(/^\s*(atta|chapati flour)\s*$/i, 'wheat flour').replace(/\(.*?\)/g, ''));
  const s = clean(stockName), i = clean(ingName);
  if (!s || !i) return false;
  if (s === i) return true;
  const st = s.split(/\s+/), it = i.split(/\s+/);
  if (!st.every(w => it.includes(w))) return false;
  const head = a => a[a.length - 1];
  return head(st) === head(it) || (st.length === 1 && ['chicken', 'fish', 'lamb', 'prawn', 'egg', 'paneer', 'dal'].includes(s));
}

// ---- Plan generation ----
// plan.slots has 21 entries, index = day*3 + meal index (b,l,d).
// slot kinds: recipe, leftover (from a batch-cooked dinner), fridge (cooked food already at home), skip, none
function generatePlan(state, seed) {
  const rnd = mulberry32(seed || 1);
  const members = state.members;
  const f = householdFactor(members);
  const slots = Array(21).fill(null);
  const warnings = [];
  const idx = (d, m) => d * 3 + MEALS.indexOf(m);

  const pool = { b: [], l: [], d: [] };
  const eliminated = { b: {}, l: {}, d: {} };
  RECIPES.forEach(r => {
    const v = validFor(r, members);
    if (v.ok) pool[r.meal].push(r);
    else v.reasons.forEach(x => { const who = x.split(':')[0]; eliminated[r.meal][who] = (eliminated[r.meal][who] || 0) + 1; });
  });
  const poolInfo = {};
  MEALS.forEach(m => { poolInfo[m] = { valid: pool[m].length, total: RECIPES.filter(r => r.meal === m).length }; });

  const rem = (state.stock || []).map(s => ({ ...s, left: Number(s.qty) || 0 }));
  const used = new Set();
  const chosen = []; // {slot, r}

  function stockBonus(r, mult) {
    const ing = r.ingr.filter(i => i.cat !== 'S');
    let sum = 0;
    ing.forEach(i => {
      const need = i.qty * f * mult;
      rem.forEach(s => {
        if (s.unit === i.unit && s.left > 0 && stockMatches(s.name, i.name)) sum += (Math.min(s.left, need) / need) * (s.soon ? 2 : 1);
      });
    });
    return ing.length ? (4 * sum) / ing.length : 0;
  }
  function consumeStock(r, mult) {
    r.ingr.filter(i => i.cat !== 'S').forEach(i => {
      let need = i.qty * f * mult;
      rem.forEach(s => {
        if (s.unit === i.unit && s.left > 0 && need > 0 && stockMatches(s.name, i.name)) {
          const u = Math.min(s.left, need); s.left -= u; need -= u;
        }
      });
    });
  }
  function score(r, day, meal, noise) {
    let sc = noise ? rnd() * 1.5 : 0;
    sc += likesScore(r, members) * 2 + stockBonus(r, 1);
    const mp = mainProtein(r);
    let sameWeek = 0, sameCuisine = 0;
    chosen.forEach(c => {
      if (c.r.meal === meal) {
        if (mainProtein(c.r) === mp && mp !== 'veg') sameWeek++;
        if (c.r.cuisine === r.cuisine) sameCuisine++;
        if (Math.abs(c.day - day) === 1 && mainProtein(c.r) === mp && mp !== 'veg') sc -= 3;
        if (Math.abs(c.day - day) === 1 && c.r.cuisine === r.cuisine) sc -= 0.7;
      } else if (c.day === day && mainProtein(c.r) === mp && mp !== 'veg') sc -= 2;
    });
    return sc + (CUISINE_BONUS[r.cuisine] || 0) - sameWeek * 1.2 - sameCuisine * 0.15;
  }
  function pick(day, meal, candidatesOverride) {
    let cands = (candidatesOverride || pool[meal]).filter(r => !used.has(r.id));
    let repeated = false;
    if (!cands.length) {
      cands = candidatesOverride || pool[meal];
      repeated = cands.length > 0;
    }
    if (!cands.length) return null;
    let best = null, bs = -1e9;
    cands.forEach(r => { const s = score(r, day, meal, true); if (s > bs) { bs = s; best = r; } });
    return { r: best, repeated };
  }
  function assign(day, meal, r, extra) {
    slots[idx(day, meal)] = { kind: 'recipe', recipeId: r.id, ...extra };
    used.add(r.id); chosen.push({ day, meal, r });
    consumeStock(r, (extra && extra.cookDouble) ? 2 : 1);
  }

  // 1. skipped meals (eating out)
  (state.skips || []).forEach(k => { const [d, m] = k.split('-'); slots[idx(+d, m)] = { kind: 'skip' }; });

  // 2. special requests
  (state.requests || []).forEach(q => {
    const i = idx(q.day, q.meal);
    if (!q.text || (slots[i] && slots[i].kind === 'skip')) return;
    const ts = terms(q.text);
    const match = rr => ts.some(t => recipeText(rr).includes(t));
    const okc = pool[q.meal].filter(match);
    if (okc.length) {
      const p = pick(q.day, q.meal, okc);
      assign(q.day, q.meal, p.r, { request: q.text });
    } else {
      const any = RECIPES.filter(r => r.meal === q.meal && match(r));
      if (any.length) {
        const why = [...new Set(validFor(any[0], members).reasons)].slice(0, 2).join('; ');
        warnings.push(`Could not add "${q.text}" for ${MEAL_NAME[q.meal].toLowerCase()} on day ${q.day + 1}. The matching recipe breaks a restriction (${why}).`);
      } else warnings.push(`No ${MEAL_NAME[q.meal].toLowerCase()} recipe matches "${q.text}" yet.`);
    }
  });

  // 3. cooked food already in the fridge
  (state.fridge || []).forEach(item => {
    for (let k = 0; k < (Number(item.meals) || 1); k++) {
      let target = null;
      for (const m of ['l', 'd']) {
        for (let d = 0; d < 7 && !target; d++) if (!slots[idx(d, m)]) target = idx(d, m);
        if (target !== null) break;
      }
      if (target !== null) slots[target] = { kind: 'fridge', name: item.name };
    }
  });

  // 4. dinners, 5. batch-cook leftovers, 6. lunches, 7. breakfasts
  const fill = meal => {
    for (let d = 0; d < 7; d++) {
      if (slots[idx(d, meal)]) continue;
      const p = pick(d, meal);
      if (!p) { slots[idx(d, meal)] = { kind: 'none' }; continue; }
      assign(d, meal, p.r, p.repeated ? { repeated: true } : {});
    }
  };
  fill('d');
  if (state.batch !== false) {
    let count = 0, last = -9;
    for (let d = 0; d < 6 && count < 2; d++) {
      const ds = slots[idx(d, 'd')], ls = slots[idx(d + 1, 'l')];
      if (ds && ds.kind === 'recipe' && !ds.repeated && !ds.request && !ls && d - last >= 2) {
        const r = RECIPES.find(x => x.id === ds.recipeId);
        if (r.keeps) {
          ds.cookDouble = true; consumeStock(r, 1);
          slots[idx(d + 1, 'l')] = { kind: 'leftover', recipeId: r.id, fromDay: d };
          count++; last = d;
        }
      }
    }
  }
  fill('l');
  fill('b');

  MEALS.forEach(m => {
    const p = poolInfo[m];
    if (p.valid === 0) warnings.push(`No ${MEAL_NAME[m].toLowerCase()} recipes fit everyone's restrictions together.`);
    else if (slots.some((s, i) => MEALS[i % 3] === m && s && s.repeated)) warnings.push(`Only ${p.valid} ${MEAL_NAME[m].toLowerCase()} ${p.valid === 1 ? 'recipe fits' : 'recipes fit'} everyone, so some repeat this week.`);
  });
  return { slots, warnings, poolInfo, eliminated, seed };
}

// ---- Alternatives for one slot ----
function alternatives(plan, state, slotIndex, limit) {
  const meal = MEALS[slotIndex % 3];
  const inPlan = new Set(plan.slots.filter(s => s && s.recipeId).map(s => s.recipeId));
  const list = RECIPES.filter(r => r.meal === meal && !inPlan.has(r.id) && validFor(r, state.members).ok);
  const stockScore = r => {
    const f = householdFactor(state.members);
    let s = 0;
    r.ingr.forEach(i => (state.stock || []).forEach(st => { if (st.unit === i.unit && stockMatches(st.name, i.name)) s += st.soon ? 2 : 1; }));
    return s + likesScore(r, state.members) * 2;
  };
  return list.sort((a, b) => stockScore(b) - stockScore(a)).slice(0, limit || 4);
}

function swap(plan, slotIndex, recipeId) {
  const slots = plan.slots.map(s => (s ? { ...s } : s));
  const old = slots[slotIndex];
  slots[slotIndex] = { kind: 'recipe', recipeId, swapped: true };
  // a batch-cooked dinner that is swapped no longer feeds the next lunch
  if (old && old.cookDouble) {
    const nx = slots[slotIndex + 1];
    if (nx && nx.kind === 'leftover') slots[slotIndex + 1] = { kind: 'none' };
  }
  if (old && old.kind === 'leftover') { /* swapped to a fresh recipe; dinner stays doubled but unused */
    const src = slots[old.fromDay * 3 + 2];
    if (src) delete src.cookDouble;
  }
  return { ...plan, slots };
}

// ---- Summary: grocery, stock, nutrition, variety, leftovers ----
function fmtQty(q, unit) {
  if (unit === 'g') return q >= 1000 ? `${(q / 1000).toFixed(q % 1000 === 0 ? 0 : 1)} kg` : `${q} g`;
  if (unit === 'ml') return q >= 1000 ? `${(q / 1000).toFixed(q % 1000 === 0 ? 0 : 1)} L` : `${q} ml`;
  return `${q}`;
}
function roundUp(q, unit) { return unit === 'pc' ? Math.ceil(q - 1e-9) : Math.ceil(q / 10 - 1e-9) * 10; }

const CAT_NAME = { P: 'Fruit and vegetables', M: 'Meat, fish and tofu', D: 'Dairy and eggs', G: 'Tins, grains and pantry', B: 'Bakery' };

function summarize(plan, state) {
  const members = state.members;
  const f = householdFactor(members);
  const needs = {};
  const perDay = Array.from({ length: 7 }, () => ({ kcal: 0, protein: 0, carbs: 0, fat: 0, n: 0 }));
  const memberTot = members.map(() => ({ kcal: 0, protein: 0, fiber: 0, sodium: 0, sugar: 0, meals: 0 }));
  const proteins = {}; const recipesUsed = new Set();
  let vegMeals = 0, fishMeals = 0, planned = 0;
  const plannedLeft = [], fridgeMeals = [];

  plan.slots.forEach((s, i) => {
    const day = Math.floor(i / 3);
    if (!s) return;
    if (s.kind === 'skip' || s.kind === 'none') return;
    let r = null, est = false, nutr;
    if (s.kind === 'fridge') { est = true; nutr = { kcal: 550, protein: 25, carbs: 70, fat: 18, fiber: 6, sodium: 600, sugar: 6 }; fridgeMeals.push({ day, name: s.name }); }
    else {
      r = RECIPES.find(x => x.id === s.recipeId); nutr = r.nutr;
      if (s.kind === 'leftover') plannedLeft.push({ day, fromDay: s.fromDay, recipe: r });
      if (s.kind === 'recipe') {
        const mult = s.cookDouble ? 2 : 1;
        r.ingr.forEach(g => {
          if (g.cat === 'S') return;
          const k = g.name + '|' + g.unit;
          if (!needs[k]) needs[k] = { name: g.name, unit: g.unit, cat: g.cat, need: 0 };
          needs[k].need += g.qty * f * mult;
        });
        recipesUsed.add(r.id);
        const mp = mainProtein(r); proteins[mp] = (proteins[mp] || 0) + 1;
        if (['veg', 'legumes', 'tofu', 'dairy', 'egg'].includes(mp)) vegMeals++;
        if (r.allergens.includes('fish')) fishMeals++;
      }
    }
    planned++;
    perDay[day].kcal += nutr.kcal; perDay[day].protein += nutr.protein; perDay[day].carbs += nutr.carbs; perDay[day].fat += nutr.fat; perDay[day].n++;
    members.forEach((m, k) => {
      const fa = ageInfo(m.age).factor, t = memberTot[k];
      t.kcal += nutr.kcal * fa; t.protein += nutr.protein * fa; t.fiber += nutr.fiber * fa; t.sodium += nutr.sodium * fa; t.sugar += nutr.sugar * fa; t.meals++;
    });
  });

  // grocery = needs minus stock
  const stockLeft = (state.stock || []).map(s => ({ ...s, left: Number(s.qty) || 0, used: 0 }));
  const items = Object.values(needs).map(n => {
    let need = n.need, fromStock = 0;
    stockLeft.forEach(s => {
      if (s.unit === n.unit && s.left > 0 && need > 0 && stockMatches(s.name, n.name)) {
        const u = Math.min(s.left, need); s.left -= u; s.used += u; need -= u; fromStock += u;
      }
    });
    return { ...n, fromStock, buy: need > 0.0001 ? roundUp(need, n.unit) : 0, total: roundUp(n.need, n.unit) };
  });
  const groups = {};
  items.forEach(it => { (groups[it.cat] = groups[it.cat] || []).push(it); });
  const grocery = Object.keys(CAT_NAME).filter(c => groups[c]).map(c => ({
    cat: CAT_NAME[c], items: groups[c].sort((a, b) => a.name.localeCompare(b.name))
  }));
  const toBuy = items.filter(i => i.buy > 0).length;
  const covered = items.filter(i => i.buy === 0).length;

  const nutrition = memberTot.map((t, k) => {
    const a = ageInfo(members[k].age);
    const perDayAvg = x => Math.round(x / (planned / 3));
    const kcal = perDayAvg(t.kcal), protein = perDayAvg(t.protein), fiber = perDayAvg(t.fiber), sodium = perDayAvg(t.sodium);
    return {
      name: members[k].name, label: a.label, kcal, protein, fiber, sodium, sugar: perDayAvg(t.sugar),
      target: a, pctKcal: Math.round((kcal / a.kcal) * 100),
      proteinOk: protein >= a.protein * 0.9, fiberOk: fiber >= a.fiber * 0.75, sodiumOk: sodium <= a.sodium
    };
  });
  const house = perDay.map(d => ({ kcal: Math.round(d.kcal * 3 / Math.max(1, d.n)), protein: Math.round(d.protein * 3 / Math.max(1, d.n)), carbs: Math.round(d.carbs * 3 / Math.max(1, d.n)), fat: Math.round(d.fat * 3 / Math.max(1, d.n)), n: d.n }));
  const tot = house.reduce((a, d) => ({ p: a.p + d.protein * 4, c: a.c + d.carbs * 4, f: a.f + d.fat * 9 }), { p: 0, c: 0, f: 0 });
  const sumE = tot.p + tot.c + tot.f || 1;
  const macro = { protein: Math.round(tot.p / sumE * 100), carbs: Math.round(tot.c / sumE * 100), fat: Math.round(tot.f / sumE * 100) };

  const unusedStock = stockLeft.filter(s => s.left > 0.0001).map(s => ({ name: s.name, qty: Math.round(s.left), unit: s.unit, soon: !!s.soon, wasUsed: s.used > 0 }));
  const usedStock = stockLeft.filter(s => s.used > 0.0001).map(s => ({ name: s.name, qty: Math.round(s.used), unit: s.unit }));
  const inPlan = new Set(recipesUsed);
  const ideas = unusedStock.filter(s => !s.wasUsed).slice(0, 6).map(s => {
    const rs = RECIPES.filter(r => !inPlan.has(r.id) && r.ingr.some(i => stockMatches(s.name, i.name)) && validFor(r, members).ok).slice(0, 2);
    return { stock: s, recipes: rs };
  }).filter(x => x.recipes.length);

  return {
    grocery, toBuy, covered, nutrition, house, macro, usedStock, unusedStock, ideas,
    variety: { meals: planned, distinct: recipesUsed.size, proteins, vegMeals, fishMeals },
    leftovers: { planned: plannedLeft, fridge: fridgeMeals }
  };
}

if (typeof module !== 'undefined') module.exports = { generatePlan, summarize, validFor, alternatives, swap, ageInfo, householdFactor, mainProtein, conflicts, stockMatches, norm };

// ===== App part 1: state, helpers, icons, the four setup steps =====

  plus: 'M12 5v14M5 12h14', minus: 'M5 12h14', check: 'M5 13l4 4L19 7', x: 'M6 6l12 12M18 6L6 18',
  trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3', left: 'M15 5l-7 7 7 7', right: 'M9 5l7 7-7 7', down: 'M5 9l7 7 7-7',
  alert: 'M12 4l9 16H3zM12 10v4M12 17v.5', swap: 'M4 8h13l-3-3M20 16H7l3 3', copy: 'M9 9h11v11H9zM5 15V4h11', refresh: 'M20 11a8 8 0 10-2.3 5.7M20 4v7h-7',
  spark: 'M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z', info: 'M12 8v.5M12 11v6M3 12a9 9 0 1018 0 9 9 0 10-18 0'

function ic(n, cls) { return `<svg class="ic ${cls || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function defaultState() {

function qtyText(q, unit, name) {

}
function buyText(it) { return it.unit === 'pc' ? `${it.buy}${/bread/i.test(it.name) ? ' slices' : /tortilla/i.test(it.name) ? ' wraps' : ''}` : fmtQty(it.buy, it.unit); }
function haveText(it) { return it.unit === 'pc' ? `${Math.round(it.fromStock)}` : fmtQty(Math.round(it.fromStock), it.unit); }
function needsLine(m) {

  const p = [];
  m.allergies.forEach(a => p.push('no ' + lab(ALLERGY_OPTS, a).toLowerCase()));

}

  const f = householdFactor(es.members);
  const warn = ui.plan.warnings.map(w => `<div class="notice">${ic('alert')}<div>${esc(w)}</div></div>`).join('');
  const safe = `<div class="notice ok">${ic('check')}<div><b>Every meal was checked against everyone's needs.</b><br>${es.members.map(m => `${esc(m.name)}: ${esc(needsLine(m))}`).join('<br>')}</div></div>`;
  const v = S.variety, left = S.leftovers.planned.length + S.leftovers.fridge.length;
  const line = `<div class="summary-line"><span class="tag good">${v.meals} meals planned</span><span class="tag good">${v.distinct} different recipes</span><span class="tag good">${Object.keys(v.proteins).length} kinds of main protein</span>${left ? `<span class="tag good">${left} leftover ${left === 1 ? 'meal' : 'meals'}</span>` : ''}</div>`;
  const days = [0, 1, 2, 3, 4, 5, 6].map(d => `<article class="day"><header><h3>${esc(dayLabel(d, true))}</h3><span class="fine">${S.house[d].n ? `about ${S.house[d].kcal} kcal per adult` : ''}</span></header>${MEALS.map((m, k) => mealRow(d * 3 + k, es, S, f)).join('')}</article>`).join('');
  return `${safe}${warn}${line}<div class="days">${days}</div>`;
}

// ---------- shopping tab ----------
function groceryText(S) {
  const out = [`Shopping list for ${state.hhName}`, ''];
  S.grocery.forEach(g => { const it = g.items.filter(x => x.buy > 0); if (it.length) { out.push(g.cat.toUpperCase()); it.forEach(x => out.push(`[ ] ${x.name}: ${buyText(x)}`)); out.push(''); } });
  return out.join('\n').trim();
}
function shopTab(es, S) {
  const groups = S.grocery.map(g => {
    const buy = g.items.filter(x => x.buy > 0);
    if (!buy.length) return '';
    return `<section class="card"><h3>${esc(g.cat)}</h3><div class="groc">${buy.map(it => {
      const k = it.name + '|' + it.unit;
      return `<label><input type="checkbox" data-f="chk" data-k="${esc(k)}" ${ui.checked[k] ? 'checked' : ''}><span class="nm">${esc(it.name)}${it.fromStock ? `<span class="st">You have ${haveText(it)}, need ${qtyText(it.total, it.unit, it.name)} in total</span>` : ''}</span><span class="qt">${buyText(it)}</span></label>`;
    }).join('')}</div></section>`;
  }).join('');
  const have = S.grocery.flatMap(g => g.items.filter(x => x.buy === 0));
  const haveHtml = have.length ? `<section class="card"><h3>Already covered by your stock</h3><div class="groc have">${have.map(it => `<label style="cursor:default"><span class="nm">${esc(it.name)}</span><span class="qt">${ic('check')}</span></label>`).join('')}</div></section>` : '';
  const copy = ui.showText ? `<section class="card"><h3>Copy this list</h3><textarea id="copy-box" readonly rows="10" style="width:100%;border:2px solid var(--ctl);border-radius:14px;padding:12px;background:var(--surface)">${esc(ui.showText)}</textarea></section>` : '';
  return `<section class="card soft"><div class="row" style="align-items:center"><div style="flex:1 1 260px"><h2>${S.toBuy} ${S.toBuy === 1 ? 'item' : 'items'} to buy</h2><p>${S.covered ? `${S.covered} more ${S.covered === 1 ? 'is' : 'are'} covered by what you already have.` : 'Amounts are for the whole household for the week.'}</p></div><button class="btn" ${A('copy-list')}>${ic('copy')} Copy list</button></div></section>
    ${copy}${groups || '<div class="empty">Nothing to buy. Your stock covers the plan.</div>'}${haveHtml}
    <p class="fine">Salt, pepper, cooking oil, olive oil and basic spices are assumed to be at home. Amounts are rounded up to practical sizes.</p>`;
}

// ---------- nutrition tab ----------
function barRow(label, val, target, unit, okFlag, invert) {
  const pct = Math.min(100, Math.round((val / target) * 100));
  const tag = okFlag ? `<span class="tag good">${ic('check')} On track</span>` : `<span class="tag warn">${ic('alert')} ${invert ? 'High' : 'A bit low'}</span>`;
  return `<div class="bar-row"><span class="lab">${label}</span><div class="track" role="img" aria-label="${label}: ${val} ${unit} of ${target} ${unit}"><span class="fill ${okFlag ? '' : 'warn'}" style="width:${pct}%"></span></div><span>${val} / ${target} ${unit} ${tag}</span></div>`;
}
function nutritionTab(es, S) {
  const cards = S.nutrition.map((n, i) => {
    const e = n.pctKcal, eok = e >= 65 && e <= 110;
    return `<section class="card"><div class="row" style="align-items:center;flex-wrap:nowrap"><span class="avatar ${lc(i)}">${initial(es.members[i], i)}</span><div><h3>${esc(n.name)}</h3><span class="fine">${n.label}, ${es.members[i].age} years old</span></div></div>
      ${barRow('Energy', n.kcal, n.target.kcal, 'kcal', eok, e > 110)}
      ${barRow('Protein', n.protein, n.target.protein, 'g', n.proteinOk)}
      ${barRow('Fibre', n.fiber, n.target.fiber, 'g', n.fiberOk)}
      ${barRow('Sodium', n.sodium, n.target.sodium, 'mg', n.sodiumOk, true)}
      <p class="fine">${eok ? 'Meals cover the main share of daily energy. Snacks and drinks fill the rest.' : e < 65 ? 'Meals cover less than usual. Add healthy snacks such as fruit, yogurt or nuts.' : 'Meals are above the daily target. Keep snacks light.'}${n.fiberOk ? '' : ' A piece of fruit or extra vegetables would help with fibre.'}</p></section>`;
  }).join('');
  const m = S.macro, mx = Math.max(1, ...S.house.map(d => d.kcal));
  const bars = S.house.map((d, i) => `<div class="daybar"><span>${d.kcal || '-'}</span><span class="col" style="height:${Math.max(3, Math.round(d.kcal / mx * 130))}px" role="img" aria-label="${esc(wdName(i))}: ${d.kcal} kcal"></span><span>${esc(dayDate(i).toLocaleDateString(undefined, { weekday: 'short' }))}</span></div>`).join('');
  return `<div class="mem-nutr">${cards}</div>
    <section class="card"><h3>Balance of the whole week</h3>
      <div class="macro" role="img" aria-label="Protein ${m.protein}%, carbohydrate ${m.carbs}%, fat ${m.fat}% of energy"><span class="m-p" style="flex:${m.protein}">${m.protein}%</span><span class="m-c" style="flex:${m.carbs}">${m.carbs}%</span><span class="m-f" style="flex:${m.fat}">${m.fat}%</span></div>
      <div class="legend"><span><i class="m-p"></i>Protein</span><span><i class="m-c"></i>Carbohydrate</span><span><i class="m-f"></i>Fat</span></div>
      <p class="fine">A balanced plate is roughly 10 to 35% protein, 45 to 65% carbohydrate and 20 to 35% fat. Every lunch and dinner includes vegetables and a protein source.</p></section>
    <section class="card"><h3>Energy per day (one adult serving, kcal)</h3><div class="daybars">${bars}</div></section>
    <p class="fine">These are estimates from typical recipes and portion sizes, not medical advice. Check with a doctor or dietitian for medical diets.</p>`;
}

// ---------- leftovers tab ----------
function leftoversTab(es, S) {
  const L = S.leftovers;
  const planned = L.planned.length ? L.planned.map(x => `<li class="item"><span class="grow">${esc(wdName(x.fromDay))} dinner to ${esc(wdName(x.day))} lunch: ${x.recipe.icon} ${esc(x.recipe.name)}</span></li>`).join('')
    : `<li class="empty">${state.batch ? 'No suitable double batches this week.' : 'Batch cooking is off. Turn it on in step 1 to save cooking time.'}</li>`;
  const fr = L.fridge.length ? L.fridge.map(x => `<li class="item"><span class="grow">${esc(x.name)} on ${esc(wdName(x.day))}</span></li>`).join('') : `<li class="empty">No cooked food from the fridge in this plan.</li>`;
  const used = S.usedStock.length ? `<div class="chips">${S.usedStock.map(u => `<span class="tag good">${ic('check')} ${esc(u.name)}: ${u.unit === 'pc' ? u.qty : fmtQty(u.qty, u.unit)}</span>`).join('')}</div>` : '<p class="muted">None of your stock matched this week\'s meals.</p>';
  const unused = S.unusedStock.length ? `<ul class="list">${S.unusedStock.map(u => `<li class="item"><span class="grow">${esc(u.name)}: ${u.unit === 'pc' ? u.qty : fmtQty(u.qty, u.unit)} left over${u.wasUsed ? ' after the plan' : ''}</span>${u.soon ? '<span class="tag warn">Use soon</span>' : ''}</li>`).join('')}</ul>` : '<p class="muted">Everything you listed is used. Nothing left over.</p>';
  const ideas = S.ideas.length ? `<div><h4 style="font-family:var(--font-display);margin:0 0 8px">Ideas to use up the rest</h4><div class="alts">${S.ideas.map(x => x.recipes.map(r => `<div class="alt"><span>${r.icon} <b>${esc(r.name)}</b> <span class="muted small">uses ${esc(x.stock.name)}</span></span><button class="btn small-btn" ${A('idea', r.id)}>${ic('swap')} Swap into plan</button></div>`).join('')).join('')}</div></div>` : '';
  return `<section class="card"><h2>Planned leftovers</h2><ul class="list">${planned}</ul><p class="fine">Cool cooked food within 2 hours, keep it covered in the fridge and eat it within 3 days. Reheat until steaming hot.</p></section>
    <section class="card"><h2>Cooked food from your fridge</h2><ul class="list">${fr}</ul></section>
    <section class="card"><h2>Your stock</h2><div><h4 style="font-family:var(--font-display);margin:0 0 8px">Used this week</h4>${used}</div><div><h4 style="font-family:var(--font-display);margin:0 0 8px">Not used this week</h4>${unused}</div>${ideas}</section>`;
}

function renderResults() {
  const es = engineState(), S = summarize(ui.plan, es);
  const tabs = [['plan', 'Week plan'], ['shop', 'Shopping list'], ['nutr', 'Nutrition'], ['left', 'Leftovers']];
  const body = ui.tab === 'plan' ? planTab(es, S) : ui.tab === 'shop' ? shopTab(es, S) : ui.tab === 'nutr' ? nutritionTab(es, S) : leftoversTab(es, S);
  ui.S = S;
  return `<section class="card soft"><div class="row" style="align-items:center"><div style="flex:1 1 260px"><h1>${esc(state.hhName)}</h1><p class="muted">Week of ${esc(dayLabel(0, true))}</p></div>
    <button class="btn ghost" ${A('goto', 1)}>Edit household</button><button class="btn" ${A('newseed')}>${ic('refresh')} New ideas</button></div></section>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" ${A('tab', k)} aria-selected="${ui.tab === k}">${l}</button>`).join('')}</div>${body}`;
}

// ---------- render + events ----------
function render() {
  const ae = document.activeElement, fk = ae && ae.dataset && ae.dataset.fk;
  const snap = {}; $app.querySelectorAll('input[id^="st-"],input[id^="fr-"],input[id^="rq-"],select[id^="st-"],select[id^="rq-"]').forEach(el => { snap[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  const body = ui.view === 'wizard' ? stepper() + [step1, step2, step3, step4][ui.step - 1]() : renderResults();
  $app.innerHTML = `<div class="wrap">${header()}${body}</div>`;
  Object.keys(snap).forEach(id => { const el = document.getElementById(id); if (el) { if (el.type === 'checkbox') el.checked = snap[id]; else el.value = snap[id]; } });
  if (fk) { const el = $app.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) el.focus({ preventScroll: true }); }
  const cb = document.getElementById('copy-box'); if (cb) { cb.focus(); cb.select(); }
  save();
}
function regenerate() { ui.plan = generatePlan(engineState(), state.seed); ui.view = 'results'; ui.tab = 'plan'; ui.open = {}; ui.alt = {}; ui.checked = {}; ui.showText = null; }
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };

function act(a, arg) {
  const mem = () => state.members[state.cur];
  switch (a) {
    case 'goto': ui.view = 'wizard'; ui.step = +arg; window.scrollTo(0, 0); break;
    case 'goto-results': ui.view = 'results'; window.scrollTo(0, 0); break;
    case 'fresh': state = blankState(); ui.plan = null; ui.step = 1; break;
    case 'age-': case 'age+': { const m = state.members[+arg]; m.age = Math.max(1, Math.min(110, m.age + (a === 'age+' ? 1 : -1))); break; }
    case 'add-member': state.members.push({ id: Date.now(), name: '', age: 30, allergies: [], diets: [], health: [], likes: '', dislikes: '' }); break;
    case 'rm-member': state.members.splice(+arg, 1); state.cur = Math.min(state.cur, state.members.length - 1); break;
    case 'pick': state.cur = +arg; break;
    case 'tog': { const [key, i, v] = arg.split('|'); const l = state.members[+i][key]; const k = l.indexOf(v); if (k < 0) l.push(v); else l.splice(k, 1); break; }
    case 'quick': { const q = QUICK.find(x => x[0] === arg); if (q) state.stock.push({ name: q[0], qty: q[1], unit: q[2], soon: false }); break; }
    case 'add-stock': { const n = val('st-name').trim(), q = Number(val('st-qty')); if (!n || !(q > 0)) { toast('Type an ingredient and an amount'); return; } const soon = document.getElementById('st-soon').checked; state.stock.push({ name: n, qty: q, unit: val('st-unit'), soon }); document.getElementById('st-name').value = ''; break; }
    case 'rm-stock': state.stock.splice(+arg, 1); break;
    case 'soon': state.stock[+arg].soon = !state.stock[+arg].soon; break;
    case 'fr-': ui.frN = Math.max(1, (ui.frN || 1) - 1); break;
    case 'fr+': ui.frN = Math.min(6, (ui.frN || 1) + 1); break;
    case 'add-fridge': { const n = val('fr-name').trim(); if (!n) { toast('Type the name of the dish'); return; } state.fridge.push({ name: n, meals: ui.frN || 1 }); document.getElementById('fr-name').value = ''; ui.frN = 1; break; }
    case 'rm-fridge': state.fridge.splice(+arg, 1); break;
    case 'add-req': { const t = val('rq-text').trim(); if (!t) { toast('Type what you would like'); return; } state.requests.push({ day: +val('rq-day'), meal: val('rq-meal'), text: t }); document.getElementById('rq-text').value = ''; break; }
    case 'rm-req': state.requests.splice(+arg, 1); break;
    case 'skip': { const k = state.skips.indexOf(arg); if (k < 0) state.skips.push(arg); else state.skips.splice(k, 1); break; }
    case 'generate': state.seed = 1; regenerate(); window.scrollTo(0, 0); break;
    case 'newseed': state.seed = (state.seed || 1) + 1; regenerate(); toast('Fresh ideas for the week'); break;
    case 'tab': ui.tab = arg; ui.showText = null; break;
    case 'open': ui.open[arg] = !ui.open[arg]; break;
    case 'alts': ui.alt[arg] = !ui.alt[arg]; break;
    case 'swap': { const [i, rid] = arg.split('|'); ui.plan = swap(ui.plan, +i, rid); ui.alt[i] = false; toast('Meal swapped. Shopping list updated'); break; }
    case 'idea': {
      const r = RECIPES.find(x => x.id === arg); const si = ui.plan.slots.findIndex((s, i) => MEALS[i % 3] === r.meal && s && s.kind === 'recipe' && !s.request && !s.cookDouble);
      if (si < 0) { toast('No free slot for this meal type'); return; }
      ui.plan = swap(ui.plan, si, arg); toast(`Swapped into ${wdName(Math.floor(si / 3))} ${MEAL_NAME[r.meal].toLowerCase()}`); break;
    }
    case 'copy-list': {
      const text = groceryText(ui.S);
      const fallback = () => { ui.showText = text; render(); };
      try { navigator.clipboard.writeText(text).then(() => toast('Shopping list copied'), fallback); } catch (e) { fallback(); }
      return;
    }
  }
  render();
}

$app.addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (b) act(b.dataset.action, b.dataset.arg); });
$app.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const i = +t.dataset.i;
  if (f === 'name') state.members[i].name = t.value;
  else if (f === 'likes' || f === 'dislikes') { state.members[i][f] = t.value; const m = document.getElementById('meter'); if (m) m.innerHTML = meterHtml(); }
  else if (f === 'hh') { state.hhName = t.value; state.example = false; }
  else if (f === 'stockqty') state.stock[i].qty = Math.max(0, Number(t.value) || 0);
  save();
});
$app.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'start' && t.value) { state.start = t.value; save(); }
  if (f === 'batch') { state.batch = t.checked; save(); }
  if (f === 'chk') { ui.checked[t.dataset.k] = t.checked; save(); }
  if (f === 'name' || f === 'hh') render();
});

load();
render();


</script>

</body></html>
